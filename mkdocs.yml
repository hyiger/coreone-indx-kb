site_name: Core One INDX Knowledge Base
site_description: Community reference for the Bondtech INDX toolchanger on the Prusa Core One
site_url: https://hyiger.github.io/coreone-indx-kb/
repo_url: https://github.com/hyiger/coreone-indx-kb
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - stylesheets/extra.css

plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Startseite
            Calibration: Kalibrierung
            Issues: Probleme
            Overview: Übersicht
            Toolhead collisions (Complete individual objects): Werkzeugkopf-Kollisionen (Vollständige Einzelobjekte)
            Tool detection and park failures: Werkzeugerkennung und Parkfehler
            Probing and loadcell noise: Abtastung und Wägezellen-Störungen
            Tool offset calibration: Werkzeug-Offset-Kalibrierung
            Oozing during probing: Nachsickern beim Abtasten
            Wiper, purge and blobs: Abstreifer, Spülen und Blobs
            Diagonal banding: Diagonale Streifenbildung
            Nozzle hardness: Düsenhärte
            Missing slicer profiles: Fehlende Slicer-Profile
            Filament guide bore: Filamentführungsbohrung
            Silicone sock migration: Verrutschen der Silikonsocke
            Support and warranty: Support und Garantie
            G-code: G-Code
            Annotated profile: Kommentiertes Profil
            Reference: Referenz
            Assembly notes: Montagehinweise
            Build plate compatibility: Druckbett-Kompatibilität
            Hardware: Hardware
            Contributing: Mitwirken
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - toc: {permalink: true}

nav:
  - Home: index.md
  - Calibration: calibration/index.md
  - Issues:
      - Overview: issues/index.md
      - Toolhead collisions (Complete individual objects): issues/complete-individual-objects-collision.md
      - Tool detection and park failures: issues/tool-detection-ringdown-decay.md
      - Probing and loadcell noise: issues/loadcell-emi-noise.md
      - Tool offset calibration: issues/offset-sensor-board-failure.md
      - Oozing during probing: issues/oozing-during-probing-and-calibration.md
      - Wiper, purge and blobs: issues/stringing-and-wiper-calibration.md
      - Diagonal banding: issues/diagonal-banding.md
      - Nozzle hardness: issues/nozzle-hardness.md
      - Missing slicer profiles: issues/missing-slicer-profiles.md
      - Filament guide bore: issues/filament-guide-bore-unload-failure.md
      - Silicone sock migration: issues/silicone-sock-migration.md
      - Support and warranty: issues/support-and-warranty-path.md
  - G-code:
      - Overview: gcode/index.md
      - Annotated profile: gcode/indx-profile-gcode.md
  - Reference:
      - Overview: reference/index.md
      - Assembly notes: reference/assembly-notes.md
      - Build plate compatibility: reference/build-plate-compatibility.md
      - Hardware: reference/hardware.md
  - Contributing: contributing.md
exclude_docs: |
  _template.md
