name: Deploy
on:
  push: {branches: [main]}
  # Validate PRs too — the weekly refresh task delivers its work as a PR, and an
  # unchecked PR defeats the point of reviewing one. Deploy stays push-only.
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      # Fails if a German page has fallen behind the English original it was
      # translated from, or if any page is untranslated. Nothing in mkdocs
      # notices drift — a stale translation builds and deploys identically.
      - run: python tools/i18n_check.py --require-complete
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with: {path: site}
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
